[versions]
agp = "9.4.0"

compileSdk = "37"
minSdk = "28"
targetSdk = "35"

kotlin = "2.4.20"
composeMultiplatform = "1.12.0"
androidxActivityCompose = "1.13.0"
# Matches what Compose Multiplatform 1.12 already resolves transitively. The core ViewModel
# type is on the compile classpath via CMP, but viewModel() is not, so this is declared.
androidxLifecycle = "2.11.0"
# JetBrains' multiplatform build of Navigation. Type-safe routes need kotlinx.serialization,
# which is already here.
navigationCompose = "2.9.2"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
ktor = "3.5.2"
multiplatformSettings = "1.3.0"
# Multiplatform image loading. The ktor3 artifact backs Coil's network layer with the Ktor
# client already on the classpath, so there is one HTTP stack rather than two.
coil = "3.6.2"
# Backs the Android side of the session store with EncryptedSharedPreferences.
androidxSecurityCrypto = "1.1.0"

# Kotlin static analysis. Kept on the last 1.23.x release since 2.x still tracks Kotlin 2.2
# and this project is already on Kotlin 2.4.
detekt = "1.23.8"

# Legacy pre-AndroidX support library. Replaced during the KMP/CMP migration.
supportLibrary = "28.0.0"
supportDesign = "27.1.0"
supportConstraintLayout = "1.1.3"
supportTestRunner = "1.0.2"
espresso = "3.0.2"
junit = "4.12"

retrofit = "2.5.0"
okhttp = "3.12.0"
# Deliberately behind okhttp: matches the coordinate the project has always declared.
okhttpLoggingInterceptor = "3.11.0"
okio = "1.15.0"
gson = "2.8.5"
glide = "4.8.0"
glideTransformations = "2.0.1"
zxing = "2.2"

[libraries]
support-appcompat = { module = "com.android.support:appcompat-v7", version.ref = "supportLibrary" }
support-design = { module = "com.android.support:design", version.ref = "supportDesign" }
support-constraint-layout = { module = "com.android.support.constraint:constraint-layout", version.ref = "supportConstraintLayout" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
retrofit-adapter-rxjava2 = { module = "com.squareup.retrofit2:adapter-rxjava2", version.ref = "retrofit" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttpLoggingInterceptor" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-transformations = { module = "jp.wasabeef:glide-transformations", version.ref = "glideTransformations" }
zxing-library = { module = "cn.yipianfengye.android:zxing-library", version.ref = "zxing" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatformSettings" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
qr-kit = { module = "network.chaintech:qr-kit", version = "3.1.3" }

# ktlint-derived rules loaded into detekt as an extra ruleset; see composeApp/build.gradle.kts.
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

junit = { module = "junit:junit", version.ref = "junit" }
support-test-runner = { module = "com.android.support.test:runner", version.ref = "supportTestRunner" }
espresso-core = { module = "com.android.support.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
