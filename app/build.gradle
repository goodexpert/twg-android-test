apply plugin: 'com.android.application'

// Azure APIM subscription key. Resolved from local.properties (developer machines,
// gitignored) first, then the environment (CI). Never hardcode it in source.
def resolveSubscriptionKey() {
    def props = new Properties()
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        propsFile.withInputStream { props.load(it) }
    }
    def key = props.getProperty('twg.subscriptionKey') ?: System.getenv('TWG_SUBSCRIPTION_KEY')
    if (key == null || key.trim().isEmpty()) {
        logger.warn('WARNING: twg.subscriptionKey is not set in local.properties and ' +
                'TWG_SUBSCRIPTION_KEY is not in the environment. API calls will fail with 401.')
        return ''
    }
    return key.trim()
}

android {
    namespace 'nz.co.warehouseandroidtest'
    compileSdk 35
    defaultConfig {
        applicationId "nz.co.warehouseandroidtest"
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'SUBSCRIPTION_KEY', "\"${resolveSubscriptionKey()}\""
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.android.support:design:27.1.0'

    // retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.5.0'

    // okhttp
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.squareup.okio:okio:1.15.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.11.0'

    // zxing
    implementation 'cn.yipianfengye.android:zxing-library:2.2'

    // gson
    implementation 'com.google.code.gson:gson:2.8.5'

    // glide
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    implementation 'jp.wasabeef:glide-transformations:2.0.1'
}
