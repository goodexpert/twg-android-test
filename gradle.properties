# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Raised from 1536m: Kotlin/Native framework linking for the iOS targets needs
# considerably more headroom than the Android-only build did.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Required by :composeApp, which is on AndroidX. :app stays on the pre-AndroidX
# support library; the two never share a classpath, and Jetifier stays off so
# nothing rewrites :app's dependencies.
android.useAndroidX=true

kotlin.code.style=official

# AGP 9 refuses to apply com.android.application alongside the KMP plugin. These two
# flags are the documented temporary bypass; the permanent fix is splitting :composeApp
# into a com.android.kotlin.multiplatform.library module plus a thin Android app module.
android.builtInKotlin=false
android.newDsl=false

# AGP 9 promotes duplicate library namespaces from a warning to a fatal manifest-merger
# error. com.android.support:animated-vector-drawable and :support-vector-drawable both
# declare android.support.graphics.drawable, so :app cannot merge its manifest without
# this. Removable once :app is gone.
android.uniquePackageNames=false


